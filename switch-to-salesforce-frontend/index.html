<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Switch To Salesforce — documentation-style tutorials for admins and developers: Apex, Lightning Web Components, Flow Builder, platform fundamentals, interviews, and certifications."
    />
    <title>Switch To Salesforce — Learn Salesforce</title>

    <!-- Code syntax highlighting (Prism) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css" />

    <!-- Site styles -->
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/article-guide.css" />
    <link rel="stylesheet" href="css/cms-html-shared.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/track.css" />
  </head>
  <body data-page="app">
    <!-- Navbar injected here -->
    <div data-include="navbar"></div>

    <!-- Main layout: sidebar + content area -->
    <div class="layout">
      <div data-include="sidebar"></div>

      <main class="main" id="main-content">
        <!-- Welcome panel — shown by default -->
        <div id="app-home"></div>

        <!-- Article panel — shown when an article is selected from the sidebar -->
        <div id="app-article" hidden></div>
      </main>
    </div>

    <!-- Footer injected here -->
    <div data-include="footer"></div>

    <!-- Prism syntax highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>

    <!-- Core scripts -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/routes.js"></script>
    <script src="js/main.js"></script>
    <script src="js/sidebar-doc.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
